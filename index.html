<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>營會流程細節大表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --ink:#26332f;
    --muted:#7c8f8a;
    --line:#dde7e4;
    --bg:#f3f6f5;
    --d1:#2c6e63; --d1b:#eef6f4;
    --d2:#b4642d; --d2b:#fbf3ea;
    --d3:#56599c; --d3b:#f0f0fa;
    --d4:#a84e6a; --d4b:#faf0f3;
    --d5:#3d7ba6; --d5b:#eef4f9;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    margin:0;background:var(--bg);color:var(--ink);
  }

  /* ---------- 工具列 ---------- */
  .toolbar{
    position:sticky;top:0;z-index:50;background:#fff;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:12px 20px;box-shadow:0 1px 6px rgba(0,0,0,.08);
  }
  .toolbar button{
    padding:8px 14px;border:none;border-radius:20px;cursor:pointer;
    font-size:13px;font-weight:bold;background:var(--ink);color:#fff;
  }
  .toolbar button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .toolbar button:hover{opacity:.82;}
  .daynav{display:flex;gap:6px;}
  .daynav button{border-radius:50%;width:34px;height:34px;padding:0;font-size:13px;}
  .save-hint{font-size:12px;color:var(--muted);margin-left:auto;}

  .wrap{max-width:800px;margin:0 auto;padding:26px 18px 60px;}

  header.title-area{text-align:center;margin-bottom:24px;}
  h1{margin:0;font-size:27px;letter-spacing:2px;}
  h1[contenteditable]:empty:before{content:"（點此輸入營會名稱）";color:#b7c4c1;font-weight:normal;}
  .title-sub{font-size:13px;color:var(--muted);margin-top:6px;}

  /* ---------- 一天一長條 ---------- */
  .day{
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 3px 14px rgba(20,40,36,.09);margin-bottom:32px;
  }
  .day-head{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:16px 22px 13px;color:#fff;
  }
  .day-badge{
    font-size:13px;font-weight:bold;letter-spacing:3px;
    background:rgba(255,255,255,.22);padding:3px 12px;border-radius:14px;
  }
  .day-date{font-size:18px;font-weight:bold;min-width:150px;}
  .day-theme{font-size:13px;opacity:.92;min-width:150px;}
  .day-theme:empty:before{content:"（本日主題／目標）";opacity:.65;}
  .day-head [contenteditable]:focus{outline:2px dashed rgba(255,255,255,.7);border-radius:4px;}

  .day-body{padding:4px 0 14px;}

  /* ---------- 時段列 ---------- */
  .slot{
    display:flex;border-bottom:1px solid var(--line);position:relative;
  }
  .slot:last-of-type{border-bottom:none;}
  .slot-time{
    flex:none;width:112px;padding:14px 8px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border-right:3px solid;
  }
  .t-start,.t-end{
    cursor:pointer;border-radius:6px;padding:2px 8px;user-select:none;
  }
  .t-start{font-size:17.5px;font-weight:bold;}
  .t-end{font-size:13.5px;opacity:.85;}
  .t-start:hover,.t-end:hover{background:rgba(255,255,255,.75);}
  .t-start.empty,.t-end.empty{opacity:.45;font-weight:normal;font-size:13px;border:1.5px dashed currentColor;}
  .t-dash{font-size:10px;opacity:.6;}

  .slot-main{flex:1;padding:12px 18px 12px 16px;min-width:0;}
  .slot-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .act-name{font-size:16.5px;font-weight:bold;min-width:120px;}
  .act-name:empty:before{content:"活動名稱";color:#b8c3c0;font-weight:normal;}

  .chip{
    font-size:12px;font-weight:bold;padding:3px 12px;border-radius:12px;
    white-space:nowrap;cursor:pointer;border:1.5px dashed transparent;user-select:none;
  }
  .chip.empty{border-color:currentColor;opacity:.55;}
  .chip:hover{filter:brightness(.95);}

  .act-flow{font-size:13.5px;line-height:1.7;margin-top:5px;color:#41544f;}
  .act-flow:empty:before{content:"流程說明：活動怎麼進行、注意事項…";color:#b8c3c0;}

  .detail{display:flex;gap:8px;margin-top:7px;font-size:13px;line-height:1.6;align-items:flex-start;}
  .detail .tag{
    flex:none;font-size:11.5px;font-weight:bold;padding:1px 8px;border-radius:10px;
    margin-top:2px;white-space:nowrap;
  }
  .detail .val{flex:1;min-width:0;color:#41544f;}
  .detail .val:empty:before{color:#c2cecb;}
  .detail.gear .val:empty:before{content:"需要的器材、物資…";}
  .detail.note .val:empty:before{content:"備註…";}

  .duty-box{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center;cursor:pointer;min-height:24px;}
  .duty-box .p{font-size:12px;padding:2px 10px;border-radius:11px;font-weight:bold;}
  .duty-box .hint{font-size:12.5px;color:#c2cecb;}

  .slot-main [contenteditable]:focus{outline:2px solid currentColor;outline-offset:2px;border-radius:4px;}

  .slot-del{
    position:absolute;top:8px;right:8px;border:none;background:none;
    color:#c0392b;cursor:pointer;font-size:13px;opacity:0;transition:.15s;
  }
  .slot:hover .slot-del{opacity:.8;}

  .add-slot{
    display:block;margin:12px auto 4px;
    border:1.5px dashed var(--line);background:none;border-radius:10px;
    padding:8px 30px;cursor:pointer;color:var(--muted);font-size:13px;
  }
  .add-slot:hover{border-color:var(--ink);color:var(--ink);}

  /* 每天配色 */
  .day[data-day="1"]{--c:var(--d1);--cb:var(--d1b);}
  .day[data-day="2"]{--c:var(--d2);--cb:var(--d2b);}
  .day[data-day="3"]{--c:var(--d3);--cb:var(--d3b);}
  .day[data-day="4"]{--c:var(--d4);--cb:var(--d4b);}
  .day[data-day="5"]{--c:var(--d5);--cb:var(--d5b);}
  .day .day-head{background:var(--c);}
  .day .slot-time{border-right-color:var(--c);background:var(--cb);color:var(--c);}
  .day .act-name{color:var(--c);}
  .day .chip{background:var(--cb);color:var(--c);}
  .day .detail .tag{background:var(--cb);color:var(--c);}
  .day .duty-box .p{background:var(--cb);color:var(--c);}

  /* ---------- popover ---------- */
  #pop{
    position:absolute;z-index:200;background:#fff;border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;min-width:200px;display:none;
  }
  #pop .opt{
    display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
    cursor:pointer;font-size:14px;
  }
  #pop .opt:hover{background:var(--bg);}
  #pop .opt.on{background:#e8f3f0;font-weight:bold;}
  #pop .opt .ck{width:16px;text-align:center;}
  #pop input.other{
    width:100%;margin-top:6px;padding:7px 10px;border:1.5px solid var(--line);
    border-radius:8px;font-family:inherit;font-size:13px;
  }
  #pop .pop-done{
    margin-top:8px;width:100%;padding:7px;border:none;border-radius:8px;
    background:var(--ink);color:#fff;font-weight:bold;cursor:pointer;font-size:13px;
  }

  /* 時間滾輪選單 */
  .tp-wrap{display:flex;gap:8px;}
  .tp-col{
    height:190px;overflow-y:auto;width:74px;border:1px solid var(--line);
    border-radius:10px;scrollbar-width:thin;
  }
  .tp-col div{
    padding:8px 0;text-align:center;font-size:15px;cursor:pointer;border-radius:6px;
  }
  .tp-col div:hover{background:var(--bg);}
  .tp-col div.on{background:var(--ink);color:#fff;font-weight:bold;}
  .tp-label{font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px;}
  .tp-clear{
    margin-top:8px;width:100%;padding:6px;border:1.5px solid var(--line);
    border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--muted);
  }

  /* ---------- PDF 模式 ---------- */
  body.pdf-mode{background:#fff;}
  body.pdf-mode .toolbar,body.pdf-mode .add-slot,body.pdf-mode .slot-del,
  body.pdf-mode .footer-note,body.pdf-mode #pop{display:none !important;}
  body.pdf-mode .wrap{display:none;}
  #pdfArea{display:none;}
  body.pdf-mode #pdfArea{display:block;width:720px;margin:0 auto;}
  #pdfArea .pdf-page{page-break-after:always;break-after:page;}
  #pdfArea .pdf-page:last-child{page-break-after:auto;break-after:auto;}
  body.pdf-mode .day{box-shadow:none;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;}
  body.pdf-mode header.title-area{margin-bottom:10px;}
  body.pdf-mode h1{font-size:19px;}
  body.pdf-mode .title-sub{font-size:10px;margin-top:3px;}
  body.pdf-mode .t-start.empty,body.pdf-mode .t-end.empty,
  body.pdf-mode .chip.empty,body.pdf-mode .duty-box .hint{visibility:hidden;}
  /* 縮小 PDF 字級與間距 */
  body.pdf-mode .day-head{padding:9px 16px 8px;gap:10px;}
  body.pdf-mode .day-badge{font-size:10px;padding:2px 9px;letter-spacing:2px;}
  body.pdf-mode .day-date{font-size:13.5px;min-width:110px;}
  body.pdf-mode .day-theme{font-size:10.5px;min-width:110px;}
  body.pdf-mode .day-body{padding:2px 0 8px;}
  body.pdf-mode .slot-time{width:78px;padding:9px 5px;gap:1px;}
  body.pdf-mode .t-start{font-size:12.5px;padding:1px 5px;}
  body.pdf-mode .t-end{font-size:10.5px;padding:1px 5px;}
  body.pdf-mode .t-dash{font-size:7px;}
  body.pdf-mode .slot-main{padding:8px 12px 8px 11px;}
  body.pdf-mode .act-name{font-size:12px;min-width:80px;}
  body.pdf-mode .chip{font-size:9px;padding:2px 8px;}
  body.pdf-mode .act-flow{font-size:10px;line-height:1.55;margin-top:3px;}
  body.pdf-mode .detail{font-size:9.5px;margin-top:4px;gap:6px;line-height:1.5;}
  body.pdf-mode .detail .tag{font-size:8.5px;padding:1px 6px;margin-top:1px;}
  body.pdf-mode .duty-box{min-height:14px;gap:3px;}
  body.pdf-mode .duty-box .p{font-size:9px;padding:1px 7px;}

  /* ---------- 一頁多份（裁切用） ---------- */
  #pdfArea .copy-row{display:flex;justify-content:space-between;align-items:flex-start;}
  #pdfArea .copy-row .pdf-copy + .pdf-copy{border-left:1.5px dashed #a9b8b4;}
  #pdfArea .copy-row .pdf-copy{padding:0 5px;}
  #pdfArea .pdf-page.multi .day{border-radius:6px;margin-bottom:6px;}
  #pdfArea .pdf-page.multi .day-head{padding:6px 9px 5px;gap:6px;}
  #pdfArea .pdf-page.multi .day-badge{font-size:7.5px;padding:1px 6px;letter-spacing:1px;}
  #pdfArea .pdf-page.multi .day-date{font-size:10px;min-width:58px;}
  #pdfArea .pdf-page.multi .day-theme{font-size:8px;min-width:50px;}
  #pdfArea .pdf-page.multi .day-body{padding:1px 0 4px;}
  #pdfArea .pdf-page.multi .slot-time{width:46px;padding:5px 2px;gap:0;border-right-width:2px;}
  #pdfArea .pdf-page.multi .t-start{font-size:9.5px;padding:0 2px;}
  #pdfArea .pdf-page.multi .t-end{font-size:8.5px;padding:0 2px;}
  #pdfArea .pdf-page.multi .t-dash{font-size:5px;}
  #pdfArea .pdf-page.multi .slot-main{padding:5px 6px;}
  #pdfArea .pdf-page.multi .act-name{font-size:9px;min-width:50px;}
  #pdfArea .pdf-page.multi .chip{font-size:7px;padding:1px 6px;}
  #pdfArea .pdf-page.multi .act-flow{font-size:7.5px;line-height:1.5;margin-top:2px;}
  #pdfArea .pdf-page.multi .detail{font-size:7px;margin-top:2px;gap:3px;line-height:1.45;}
  #pdfArea .pdf-page.multi .detail .tag{font-size:6.5px;padding:0 4px;margin-top:0;}
  #pdfArea .pdf-page.multi .duty-box{min-height:9px;gap:2px;}
  #pdfArea .pdf-page.multi .duty-box .p{font-size:7px;padding:0 5px;}
  #pdfArea .pdf-page.multi .slot-top{gap:5px;}

  #busy{
    display:none;position:fixed;inset:0;background:rgba(255,255,255,.75);
    z-index:99;align-items:center;justify-content:center;
    font-size:16px;font-weight:bold;color:var(--ink);
  }

  /* ---------- 準備清單 ---------- */
  .chk-list{padding:4px 0 8px;}
  .chk-item{
    display:flex;gap:10px;padding:9px 20px;border-bottom:1px solid var(--line);
    align-items:flex-start;position:relative;
  }
  .chk-item:last-of-type{border-bottom:none;}
  .chk-item input[type=checkbox]{
    width:18px;height:18px;margin-top:2px;flex:none;cursor:pointer;accent-color:var(--c);
  }
  .chk-item .txt{flex:1;font-size:14px;line-height:1.55;min-width:0;}
  .chk-item.done .txt{}
  .chk-item .chk-del{
    border:none;background:none;color:#c0392b;cursor:pointer;font-size:13px;
    opacity:0;transition:.15s;flex:none;
  }
  .chk-item:hover .chk-del{opacity:.8;}
  .chk-add{display:flex;gap:8px;padding:10px 20px 14px;}
  .chk-add input{
    flex:1;border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;
    font-family:inherit;font-size:13px;
  }
  .chk-add button{
    border:1.5px solid var(--line);background:#fff;border-radius:8px;
    padding:8px 16px;cursor:pointer;font-size:13px;color:var(--ink);font-weight:bold;
  }
  body.pdf-mode .chk-add,body.pdf-mode .chk-del{display:none !important;}
  #pdfArea .chk-item{padding:6px 14px;}
  #pdfArea .chk-item .txt{font-size:11px;line-height:1.5;}
  #pdfArea .chk-item input[type=checkbox]{width:13px;height:13px;margin-top:1px;}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="makePDF(0)">📄 存 PDF（全部）</button>
  <span style="font-size:13px;color:var(--muted)">單日：</span>
  <span class="daynav" id="dayNav"></span>
  <button class="ghost" onclick="exportJSON()">💾 備份</button>
  <button class="ghost" onclick="document.getElementById('importFile').click()">📂 匯入</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
  <button class="ghost" onclick="clearAll()">🗑️ 清空</button>
  <button class="ghost" id="viewBtn" onclick="toggleView()">📋 準備清單</button>
  <button id="chkPdfBtn" style="display:none" onclick="makeChkPDF()">📄 存 PDF（清單）</button>
  <span class="save-hint" id="saveHint">自動儲存於此瀏覽器</span>
</div>

<div id="busy">⏳ 正在產生 PDF，請稍候…</div>
<div id="pop"></div>
<div id="pdfArea"></div>

<div class="wrap" id="printArea">
  <header class="title-area">
    <h1 contenteditable="true" id="campTitle"></h1>
    <div class="title-sub">營會流程細節大表｜8/2（日）－ 8/6（四）</div>
  </header>
  <div id="days"></div>
  <div id="checkArea" style="display:none"></div>
  <p class="footer-note" style="font-size:12px;color:var(--muted);text-align:center">
    時間、地點、分工都用點選；新增時段會自動接上一段的結束時間，可再改。
  </p>
</div>

<script>
const DAY_COUNT = 5;
const DEFAULT_SLOTS = 6;
const KEY = "camp_schedule_v5";
const DATES = ["8/2（日）","8/3（一）","8/4（二）","8/5（三）","8/6（四）"];
const PLACES = ["332-4 5F","110 B1","110 1F","橫山"];
const PEOPLE = ["teamzerO","許詩","幸娟","鍾祥","蘭茜","浙鑫","蓉芳","素玲","營長"];
const MIN_STEP = 5;
const daysEl = document.getElementById("days");
const pop = document.getElementById("pop");

function ce(tag, cls, editable, text){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(editable) el.contentEditable = "true";
  if(text) el.innerText = text;
  return el;
}

/* ---------- popover ---------- */
let popCleanup = null;
function openPop(anchor, buildFn){
  closePop();
  pop.innerHTML = "";
  buildFn(pop);
  pop.style.display = "block";
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 250) + "px";
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  const h = e=>{ if(!pop.contains(e.target) && e.target!==anchor && !anchor.contains(e.target)) closePop(); };
  setTimeout(()=> document.addEventListener("mousedown", h), 0);
  popCleanup = ()=> document.removeEventListener("mousedown", h);
}
function closePop(){
  if(popCleanup){ popCleanup(); popCleanup = null; }
  pop.style.display = "none";
}

/* ---------- 時間欄位 ---------- */
function setTime(el, val, placeholder){
  el.dataset.val = val || "";
  el.innerText = val || placeholder;
  el.classList.toggle("empty", !val);
}
function timePicker(el, placeholder, onSet){
  const cur = el.dataset.val || "";
  let [ch, cm] = cur ? cur.split(":") : ["",""];
  openPop(el, box=>{
    const wrap = ce("div","tp-wrap");

    const hCol = document.createElement("div");
    const hLab = ce("div","tp-label",false,"時");
    const hList = ce("div","tp-col");
    for(let h=6; h<=23; h++){   // 營會常用 06–23
      const v = String(h).padStart(2,"0");
      const o = ce("div", v===ch?"on":"", false, v);
      o.onclick = ()=>{
        ch = v;
        hList.querySelectorAll("div").forEach(d=> d.classList.toggle("on", d.innerText===v));
        if(cm!==""){ apply(); }
      };
      hList.appendChild(o);
    }
    hCol.appendChild(hLab); hCol.appendChild(hList);

    const mCol = document.createElement("div");
    const mLab = ce("div","tp-label",false,"分");
    const mList = ce("div","tp-col");
    for(let m=0; m<60; m+=MIN_STEP){
      const v = String(m).padStart(2,"0");
      const o = ce("div", v===cm?"on":"", false, v);
      o.onclick = ()=>{
        cm = v;
        if(ch===""){ ch = "08"; }
        apply();
      };
      mList.appendChild(o);
    }
    mCol.appendChild(mLab); mCol.appendChild(mList);

    wrap.appendChild(hCol); wrap.appendChild(mCol);
    box.appendChild(wrap);

    const clr = document.createElement("button");
    clr.className = "tp-clear"; clr.innerText = "清除時間";
    clr.onclick = ()=>{ setTime(el,"",placeholder); closePop(); save(); };
    box.appendChild(clr);

    // 捲到目前選的值
    setTimeout(()=>{
      const onH = hList.querySelector(".on"); if(onH) onH.scrollIntoView({block:"center"});
      const onM = mList.querySelector(".on"); if(onM) onM.scrollIntoView({block:"center"});
    },0);

    function apply(){
      const val = ch + ":" + cm;
      setTime(el, val, placeholder);
      closePop(); save();
      if(onSet) onSet(val);
    }
  });
}

/* ---------- 地點 ---------- */
function placePicker(chip){
  openPop(chip, box=>{
    PLACES.forEach(p=>{
      const o = ce("div","opt"+(chip.dataset.val===p?" on":""),false,"📍 "+p);
      o.onclick = ()=>{ setPlace(chip,p); closePop(); save(); };
      box.appendChild(o);
    });
    const inp = document.createElement("input");
    inp.className = "other"; inp.placeholder = "其他地點（輸入後按 Enter）";
    if(chip.dataset.val && !PLACES.includes(chip.dataset.val)) inp.value = chip.dataset.val;
    inp.onkeydown = e=>{
      if(e.key==="Enter"){ setPlace(chip, inp.value.trim()); closePop(); save(); }
    };
    box.appendChild(inp);
    const clr = ce("div","opt",false,"✕ 清除");
    clr.onclick = ()=>{ setPlace(chip,""); closePop(); save(); };
    box.appendChild(clr);
  });
}
function setPlace(chip, val){
  chip.dataset.val = val || "";
  chip.innerText = val ? "📍 " + val : "📍 選地點";
  chip.classList.toggle("empty", !val);
}

/* ---------- 人員 ---------- */
function dutyPicker(boxEl){
  const cur = JSON.parse(boxEl.dataset.val || "[]");
  const sel = new Set(cur.filter(p=> PEOPLE.includes(p)));
  let other = cur.filter(p=> !PEOPLE.includes(p)).join("、");
  openPop(boxEl, box=>{
    PEOPLE.forEach(p=>{
      const o = ce("div","opt"+(sel.has(p)?" on":""));
      const ck = ce("span","ck",false, sel.has(p)?"✓":"");
      o.appendChild(ck); o.appendChild(document.createTextNode(p));
      o.onclick = ()=>{
        sel.has(p) ? sel.delete(p) : sel.add(p);
        o.classList.toggle("on"); ck.innerText = sel.has(p)?"✓":"";
      };
      box.appendChild(o);
    });
    const inp = document.createElement("input");
    inp.className = "other"; inp.placeholder = "其他（可填多人，用、分隔）";
    inp.value = other;
    box.appendChild(inp);
    const done = document.createElement("button");
    done.className = "pop-done"; done.innerText = "確定";
    done.onclick = ()=>{
      const extra = inp.value.trim() ? inp.value.trim().split(/[、,，\s]+/).filter(Boolean) : [];
      setDuty(boxEl, [...sel, ...extra]);
      closePop(); save();
    };
    box.appendChild(done);
  });
}
function setDuty(boxEl, arr){
  boxEl.dataset.val = JSON.stringify(arr);
  boxEl.innerHTML = "";
  if(arr.length===0){
    boxEl.appendChild(ce("span","hint",false,"點此選人員…"));
  }else{
    arr.forEach(p=> boxEl.appendChild(ce("span","p",false,p)));
  }
}

/* ---------- 時段 ---------- */
function makeSlot(d){
  d = d || {};
  const slot = ce("div","slot");

  const time = ce("div","slot-time");
  const ts = ce("div","t-start");
  const te = ce("div","t-end");
  setTime(ts, d.start||"", "開始");
  setTime(te, d.end||"", "結束");
  ts.onclick = ()=> timePicker(ts, "開始");
  te.onclick = ()=> timePicker(te, "結束", (val)=>{
    // 結束時間設定後：若下一個時段的開始時間還是空的，自動預設接上
    const next = slot.nextElementSibling;
    if(next && next.classList.contains("slot")){
      const nts = next.querySelector(".t-start");
      if(nts && !nts.dataset.val){ setTime(nts, val, "開始"); save(); }
    }
  });
  time.appendChild(ts);
  time.appendChild(ce("div","t-dash",false,"▼"));
  time.appendChild(te);

  const main = ce("div","slot-main");
  const top = ce("div","slot-top");
  top.appendChild(ce("div","act-name",true,d.name||""));
  const placeChip = ce("span","chip");
  setPlace(placeChip, d.place||"");
  placeChip.onclick = ()=> placePicker(placeChip);
  top.appendChild(placeChip);
  main.appendChild(top);
  main.appendChild(ce("div","act-flow",true,d.flow||""));

  const dutyRow = ce("div","detail duty");
  dutyRow.appendChild(ce("span","tag",false,"👥 分工"));
  const dutyBox = ce("div","duty-box");
  setDuty(dutyBox, d.duty||[]);
  dutyBox.onclick = ()=> dutyPicker(dutyBox);
  dutyRow.appendChild(dutyBox);
  main.appendChild(dutyRow);

  [["gear","🎒 器材",d.gear],["note","📝 備註",d.note]].forEach(([k,label,v])=>{
    const row = ce("div","detail "+k);
    row.appendChild(ce("span","tag",false,label));
    row.appendChild(ce("div","val",true,v||""));
    main.appendChild(row);
  });

  const del = document.createElement("button");
  del.className = "slot-del"; del.innerText = "✕"; del.title = "刪除此時段";
  del.onclick = ()=>{ slot.remove(); save(); };

  slot.appendChild(time); slot.appendChild(main); slot.appendChild(del);
  return slot;
}

function makeDay(i, data){
  data = data || {};
  const day = ce("section","day");
  day.dataset.day = i;

  const head = ce("div","day-head");
  head.appendChild(ce("span","day-badge",false,"DAY "+i));
  head.appendChild(ce("div","day-date",false,DATES[i-1]));
  head.appendChild(ce("div","day-theme",true,data.theme||""));
  day.appendChild(head);

  const body = ce("div","day-body");
  const slots = data.slots || Array.from({length:DEFAULT_SLOTS},()=>null);
  slots.forEach(s=> body.appendChild(makeSlot(s)));

  const add = document.createElement("button");
  add.className = "add-slot"; add.innerText = "＋ 新增時段";
  add.onclick = ()=>{
    const ns = makeSlot();
    // 自動接上一段：找最後一個時段的結束（沒有就用開始）時間
    const slots = body.querySelectorAll(".slot");
    if(slots.length){
      const last = slots[slots.length-1];
      const inherit = last.querySelector(".t-end").dataset.val || last.querySelector(".t-start").dataset.val;
      if(inherit) setTime(ns.querySelector(".t-start"), inherit, "開始");
    }
    body.insertBefore(ns, add);
    save();
  };
  body.appendChild(add);

  day.appendChild(body);
  return day;
}

function collect(){
  const data = { title: document.getElementById("campTitle").innerText, days: [] };
  document.querySelectorAll(".day").forEach(dayEl=>{
    const d = {
      theme: dayEl.querySelector(".day-theme").innerText,
      slots: []
    };
    dayEl.querySelectorAll(".slot").forEach(s=>{
      d.slots.push({
        start: s.querySelector(".t-start").dataset.val || "",
        end: s.querySelector(".t-end").dataset.val || "",
        name: s.querySelector(".act-name").innerText,
        place: s.querySelector(".chip").dataset.val || "",
        flow: s.querySelector(".act-flow").innerText,
        duty: JSON.parse(s.querySelector(".duty-box").dataset.val || "[]"),
        gear: s.querySelector(".detail.gear .val").innerText,
        note: s.querySelector(".detail.note .val").innerText
      });
    });
    data.days.push(d);
  });
  return data;
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify(collect()));
      flash("已自動儲存 ✓");
    }catch(e){ flash("無法自動儲存，請用「備份」保存"); }
  },400);
}
function flash(msg){
  const el = document.getElementById("saveHint");
  el.innerText = msg;
  setTimeout(()=> el.innerText = "自動儲存於此瀏覽器",2000);
}

function render(data){
  daysEl.innerHTML = "";
  document.getElementById("campTitle").innerText = (data&&data.title)||"";
  for(let i=1;i<=DAY_COUNT;i++){
    daysEl.appendChild(makeDay(i, data&&data.days&&data.days[i-1]));
  }
}

/* ---------- PDF ---------- */
async function makePDF(dayNum, copies){
  copies = copies || 1;
  closePop();
  const busy = document.getElementById("busy");
  busy.style.display = "flex";
  const area = document.getElementById("pdfArea");
  area.innerHTML = "";
  document.body.classList.add("pdf-mode");
  try{
    // ---- 自己排版分頁：一頁塞得下多少時段就放多少，塞不下搬到下一頁 ----
    const PAGE_H = 985; // 對應 A4 可用高度（留安全邊）
    const colW = copies===1 ? 720 : (copies===2 ? 348 : 226); // 多份時的單條寬度
    const srcDays = [...document.querySelectorAll("#days .day")]
      .filter(d=> !dayNum || d.dataset.day == dayNum);

    let curPage = null, curCopy = null;
    function newPage(){
      const p = document.createElement("div");
      p.className = "pdf-page" + (copies>1 ? " multi" : "");
      const c = document.createElement("div");
      c.className = "pdf-copy";
      c.style.width = colW + "px";
      p.appendChild(c);
      area.appendChild(p);
      curPage = p; curCopy = c;
      return p;
    }
    newPage();
    if(!dayNum && copies===1){
      curCopy.appendChild(document.querySelector("header.title-area").cloneNode(true));
    }

    srcDays.forEach(dayEl=>{
      const dn = dayEl.dataset.day;
      const headSrc = dayEl.querySelector(".day-head");
      const slots = [...dayEl.querySelectorAll(".slot")];
      let cont = false, body = null;

      const startSection = ()=>{
        const sec = document.createElement("section");
        sec.className = "day"; sec.dataset.day = dn;
        const h = headSrc.cloneNode(true);
        if(cont){
          const dd = h.querySelector(".day-date");
          dd.innerText = dd.innerText + "（續）";
        }
        sec.appendChild(h);
        body = document.createElement("div");
        body.className = "day-body";
        sec.appendChild(body);
        curCopy.appendChild(sec);
      };

      // 若本頁已用超過一半，新的一天直接從下一頁開始
      if(curCopy.childElementCount > 0 && curCopy.offsetHeight > PAGE_H*0.5){
        newPage();
      }
      startSection();

      slots.forEach(s=>{
        const c = s.cloneNode(true);
        const delBtn = c.querySelector(".slot-del");
        if(delBtn) delBtn.remove();
        body.appendChild(c);
        if(curCopy.offsetHeight > PAGE_H && body.childElementCount > 0){
          body.removeChild(c);
          cont = true;
          newPage();
          startSection();
          body.appendChild(c);
        }
      });
    });

    // 多份：把每頁的單條複製成 N 條並排（中間虛線 = 裁切線）
    if(copies > 1){
      [...area.querySelectorAll(".pdf-page")].forEach(p=>{
        const src = p.querySelector(".pdf-copy");
        const row = document.createElement("div");
        row.className = "copy-row";
        for(let k=0; k<copies; k++){
          const c = (k===0) ? src : src.cloneNode(true);
          c.style.width = colW + "px";
          row.appendChild(c);
        }
        p.innerHTML = "";
        p.appendChild(row);
      });
    }

    const title = document.getElementById("campTitle").innerText.trim() || "營會流程大表";
    const suffix = copies>1 ? `_一頁${copies}份` : "";
    const name = dayNum ? `${title}_DAY${dayNum}_${DATES[dayNum-1].slice(0,3)}${suffix}.pdf` : `${title}_全五天${suffix}.pdf`;
    const blob = await html2pdf().set({
      margin:[8,7,8,7],
      filename:name,
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,useCORS:true},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css"]}
    }).from(area).outputPdf("blob");

    const url = URL.createObjectURL(blob);
    const win = window.open(url, "_blank");
    if(!win){
      const a = document.createElement("a");
      a.href = url; a.download = name; a.click();
      flash("預覽視窗被瀏覽器攔截，已改為直接下載");
    }
  }catch(e){
    alert("產生 PDF 失敗：" + e.message);
  }finally{
    document.body.classList.remove("pdf-mode");
    area.innerHTML = "";
    busy.style.display = "none";
  }
}

function exportJSON(){

  payload.checklist = collectChk();

}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      render(obj); save();
      if(obj.checklist){ chkData = obj.checklist; renderChk(); saveChk(); }
      flash("匯入成功 ✓");
    }
    catch(err){ alert("檔案格式錯誤，請確認是本工具匯出的備份檔。"); }
  };
  r.readAsText(f); input.value = "";
}

if(!chkData){
  chkData = {days: DEFAULT_CHECK.map(arr=>({items: arr.map(t=>({t:t, done:false}))}))};
}

const checkArea = document.getElementById("checkArea");

function collectChk(){
  const out = {days: []};
  checkArea.querySelectorAll(".day.chk").forEach(dayEl=>{
    const d = {items: []};
    dayEl.querySelectorAll(".chk-item").forEach(it=>{
      d.items.push({t: it.querySelector(".txt").innerText,
                    done: it.querySelector("input[type=checkbox]").checked});
    });
    out.days.push(d);
  });
  return out.days.length ? out : chkData;
}
function saveChk(){
  chkData = collectChk();
  try{ localStorage.setItem(KEY_CHK, JSON.stringify(chkData)); flash("已自動儲存 ✓"); }
  catch(e){ flash("無法自動儲存，請用「備份」保存"); }
}

function makeChkItem(item){
  const row = ce("div","chk-item"+(item.done?" done":""));
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = item.done;
  cb.onchange = ()=>{ row.classList.toggle("done", cb.checked); saveChk(); };
  const txt = ce("div","txt",true,item.t);
  txt.addEventListener("input", ()=> saveChk());
  const del = document.createElement("button");
  del.className = "chk-del"; del.innerText = "✕"; del.title = "刪除";
  del.onclick = ()=>{ row.remove(); saveChk(); };
  row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
  return row;
}

function renderChk(){
  checkArea.innerHTML = "";
  for(let i=1;i<=DAY_COUNT;i++){
    const day = ce("section","day chk");
    day.dataset.day = i;
    const head = ce("div","day-head");
    head.appendChild(ce("span","day-badge",false,"DAY "+i));
    head.appendChild(ce("div","day-date",false,DATES[i-1]));
    head.appendChild(ce("div","day-theme",false,"PPT／影音／物資 準備清單"));
    day.appendChild(head);

    const list = ce("div","chk-list");
    (chkData.days[i-1]?.items || []).forEach(it=> list.appendChild(makeChkItem(it)));
    day.appendChild(list);

    const addRow = ce("div","chk-add");
    const inp = document.createElement("input");
    inp.placeholder = "新增準備項目…（輸入後按 Enter 或＋）";
    const addBtn = document.createElement("button");
    addBtn.innerText = "＋";
    const doAdd = ()=>{
      const v = inp.value.trim(); if(!v) return;
      list.appendChild(makeChkItem({t:v, done:false}));
      inp.value = ""; saveChk();
    };
    addBtn.onclick = doAdd;
    inp.onkeydown = e=>{ if(e.key==="Enter") doAdd(); };
    addRow.appendChild(inp); addRow.appendChild(addBtn);
    day.appendChild(addRow);

    checkArea.appendChild(day);
  }
}
renderChk();
